# coturn config for Qix calls — /etc/turnserver.conf
#
# Installed by deploy/setup-turn.sh, which substitutes the placeholders below.
# If you edit this by hand, replace __PUBLIC_IP__, __REALM__, __TURN_DOMAIN__
# and __TURN_SECRET__, then: systemctl restart coturn
#
# Do not commit a filled-in copy of this file: it would contain the secret.

listening-port=3478
tls-listening-port=5349

# On a plain VPS both are the public address. Behind a cloud NAT (AWS, GCP)
# keep listening-ip on the private address and write external-ip=PUBLIC/PRIVATE.
listening-ip=__PUBLIC_IP__
external-ip=__PUBLIC_IP__

realm=__REALM__
server-name=__TURN_DOMAIN__
fingerprint

# Time-limited credentials signed by the app server (src/lib/server/calls.ts).
# static-auth-secret must equal TURN_SECRET in the app's .env.
use-auth-secret
static-auth-secret=__TURN_SECRET__

# Written by deploy/coturn-le-hook.sh, which certbot runs on every renewal.
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem

# Relay port range. Every port in it must be open in the firewall, otherwise
# allocation succeeds and the call stays silent.
min-port=49160
max-port=49200

# --- Hardening -------------------------------------------------------------
# Without denied-peer-ip this is an SSRF proxy into your own network: a client
# can ask the relay to forward to 127.0.0.1 or 10.0.0.0/8 and it will comply.
no-cli
no-tcp-relay
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Abuse ceilings --------------------------------------------------------
# A relayed video call is ~1–2 Mbit/s each way and crosses the VPS twice, so an
# unbounded server is one bored user away from eating the whole uplink.
# user-quota is concurrent sessions per credential, total-quota server-wide.
user-quota=12
total-quota=1200

syslog
